[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-policy-system"
version = "0.5.0"
description = "Geometric QKV transformer and routed experts for legal next-move prediction"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "python-chess==1.999"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
chess-policy = "chess_policy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
